<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Brain shape (simplified) -->
  <!-- Left lobe -->
  <path d="M18 34 Q14 30 15 25 Q16 19 21 18 Q23 17 25 19 Q26 16 29 16 Q32 15 33 18 L33 42 Q30 44 27 43 Q23 43 21 40 Q17 38 18 34Z"
        fill="url(#brainGrad)" opacity="0.95"/>
  <!-- Right lobe -->
  <path d="M46 34 Q50 30 49 25 Q48 19 43 18 Q41 17 39 19 Q38 16 35 16 Q32 15 31 18 L31 42 Q34 44 37 43 Q41 43 43 40 Q47 38 46 34Z"
        fill="url(#brainGrad)" opacity="0.95"/>
  <!-- Brain center crease -->
  <line x1="32" y1="17" x2="32" y2="43" stroke="#1e1b4b" stroke-width="2"/>
  <!-- Brain texture lines left -->
  <path d="M21 26 Q24 24 26 27" stroke="#c4b5fd" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M20 32 Q23 30 25 33" stroke="#c4b5fd" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M20 38 Q23 36 25 38" stroke="#c4b5fd" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Brain texture lines right -->
  <path d="M43 26 Q40 24 38 27" stroke="#c4b5fd" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M44 32 Q41 30 39 33" stroke="#c4b5fd" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M44 38 Q41 36 39 38" stroke="#c4b5fd" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Graduation cap board -->
  <polygon points="32,7 52,14 32,21 12,14" fill="url(#capGrad)"/>
  <!-- Cap top (mortarboard) -->
  <rect x="26" y="4" width="12" height="5" rx="2" fill="url(#capGrad)" opacity="0.85"/>
  <!-- Cap tassel string -->
  <line x1="52" y1="14" x2="52" y2="22" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="52" cy="23" r="2" fill="#06b6d4"/>

  <!-- Glow nodes (neural network feel) -->
  <circle cx="16" cy="44" r="2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="48" cy="44" r="2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="32" cy="48" r="2.5" fill="#818cf8" opacity="0.7"/>
  <line x1="16" y1="44" x2="32" y2="48" stroke="#a78bfa" stroke-width="0.8" opacity="0.5"/>
  <line x1="48" y1="44" x2="32" y2="48" stroke="#a78bfa" stroke-width="0.8" opacity="0.5"/>
</svg>
